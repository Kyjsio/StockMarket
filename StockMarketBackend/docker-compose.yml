services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stock-market-db
    environment:
          - ConnectionStrings__DefaultConnection=Server=db;Database=ProjektBD;User Id=sa;Password=TwojeSilneHaslo123!;TrustServerCertificate=True;
          - JwtSettings__Issuer=http://localhost:5032
          - JwtSettings__Audience=http://localhost:5032
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TwojeSilneHaslo123!' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: stock-market-api
    ports:
      - "5032:5032"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=ProjektBD;User Id=sa;Password=TwojeSilneHaslo123!;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy